{% load i18n %}

<form id="form_id_dataset_submission" enctype="multipart/form-data"
      hx-encoding:inherited="multipart/form-data" hx-get="{% url 'core:clear_form_dataset_submission' dataset.id %}" hx-trigger="dataset_files_updated from:body" class="mb-2">

    <div id="div_id_files" class="mb-3">
        <label for="id_files" class="form-label">
            <div class="d-flex align-items-center">
                <span>{% trans 'Upload Files' %}</span>
                <div id="htmx_indicator_upload_files" class="htmx-indicator d-flex align-items-center ms-2">
                    <div class="spinner-border spinner-border-sm text-secondary sm-indicator" role="status">
                        <span class="visually-hidden">{% trans 'Loading...' %}</span>
                    </div>
                </div>
            </div>
        </label>
        <div><input type="file" name="files" class="form-control" multiple="" id="id_files"> </div>
    </div>

    {# when this button is clicked either everything is fine and the form will be cleared or it should get replaced #}
    {# with a message area with an error or a form with additional options for the user. #}
    <button id="btn_id_form_submit" type="button" title="{% trans 'Upload attached files' %}"
            hx-swap="outerHTML"
            hx-post="{% url 'core:submit_dataset_files' dataset.id %}" class="btn btn-sm btn-primary"
            hx-indicator=".htmx-indicator">
        <span class="bi bi-check-square me-2"></span>{% trans 'Upload Selected Files' %}
    </button>
</form>
