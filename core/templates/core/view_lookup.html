{% extends 'base.html' %}
{% load i18n %}

{% block title_content %}
{% if page_title %}
    <div class="row">
        <div class="col">
            <div class="card">
                <div class="card-header">
                    <div class="card-title h4">{{ page_title }}</div>
                </div>
            </div>
        </div>
    </div>
{% endif %}
{% endblock %}

{% block content %}
    {% if user.is_authenticated %}
    <form id="form_area" hx-trigger="load, update_table from:body" hx-get="{{ form_url }}">

    </form>
    {% endif %}
    <div class="bg-white"><div hx-get="{{ table_count_url }}" hx-trigger="load, update_table from:body" class="ms-1">{% trans 'Count' %} : {{ element_count }}</div></div>
<div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
<table id="table_id_lookup_list" hx-swap="outerHTML" hx-get="{{ table_update_url }}" hx-trigger="load, update_table from:body" >

</table>
</div>
{% endblock %}
