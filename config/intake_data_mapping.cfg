# This config maps common directory locations to datatypes for bulk importing.
# It's a priority list so the higher up a directory mapping is in the list will
# be the first directory a Mar-DID will look for for the mapping.

# Elog log files should be in the EVENTS\elog\<mission_name>\<year>
ELOG = EVENTS\\ELOG\\LOGBOOKS\\(\S*?)\\(\d\d\d\d)$

# Uncalibrated CTD files are kept in CTD\CTD_RAW\CTDDATA This consists of all generated files
# including .SN, .cnv, .btl, .hex, .hdr, .xmlcon, .odf
CTD = CTD\\CTD_RAW\\CTDDATA$
BTL = CTD\\CTD_RAW\\BTL$
QAT = CTD\\CTD_RAW\\QAT$
RBR = CTD\\RBR$

WINK = BIOCHEM\\OXYGEN$
PSAL = BIOCHEM\\SALTS$
CPHL = BIOCHEM\\CHL$

